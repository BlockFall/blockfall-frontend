<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210">
  <defs>
    <linearGradient id="go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffba45"/>
      <stop offset="100%" stop-color="#cc6200"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d8"/>
      <stop offset="100%" stop-color="#0c3580"/>
    </linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55d5f8"/>
      <stop offset="100%" stop-color="#0880c8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#00000040"/>
    </filter>
    <filter id="tshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Top orange block -->
  <rect x="89" y="13" width="32" height="32" rx="6" fill="url(#go)" stroke="#a85000" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="93" y="17" width="14" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>

  <!-- Small square accent (bottom-right of top orange, aligned with right block left and top block bottom) -->
  <rect x="126" y="30" width="15" height="15" rx="3.5" fill="url(#go)" stroke="#a85000" stroke-width="1.2" filter="url(#sh)"/>
  <rect x="128.5" y="32.5" width="6" height="4" rx="2" fill="rgba(255,255,255,0.55)"/>

  <!-- Blue block (left) -->
  <rect x="52" y="50" width="32" height="32" rx="6" fill="url(#gb)" stroke="#0a2c6e" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="56" y="54" width="14" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>

  <!-- Cyan block (center) -->
  <rect x="89" y="50" width="32" height="32" rx="6" fill="url(#gc)" stroke="#0660a0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="93" y="54" width="14" height="8" rx="4" fill="rgba(255,255,255,0.45)"/>

  <!-- Orange block (right) -->
  <rect x="126" y="50" width="32" height="32" rx="6" fill="url(#go)" stroke="#a85000" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="130" y="54" width="14" height="8" rx="4" fill="rgba(255,255,255,0.5)"/>

  <!-- BLOCK text -->
  <text
    x="105"
    y="132"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="40"
    text-anchor="middle"
    fill="white"
    stroke="#023047"
    stroke-width="8"
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#tshadow)"
    letter-spacing="1"
  >BLOCK</text>

  <!-- FALL text -->
  <text
    x="110"
    y="178"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-weight="900"
    font-size="40"
    text-anchor="middle"
    fill="#ffb703"
    stroke="#7a3a00"
    stroke-width="8"
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#tshadow)"
    letter-spacing="2"
  >FALL</text>
</svg>
