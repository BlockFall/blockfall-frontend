<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffba45"/>
      <stop offset="100%" stop-color="#cc6200"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d8"/>
      <stop offset="100%" stop-color="#0c3580"/>
    </linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55d5f8"/>
      <stop offset="100%" stop-color="#0880c8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="2" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Top orange block -->
  <rect x="37" y="24" width="26" height="26" rx="5" fill="url(#go)" stroke="#a85000" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="27" width="11" height="7" rx="3.5" fill="rgba(255,255,255,0.5)"/>

  <!-- Small square accent (bottom-right of top orange, aligned with right block left and top block bottom) -->
  <rect x="68" y="38" width="12" height="12" rx="3" fill="url(#go)" stroke="#a85000" stroke-width="1.2" filter="url(#sh)"/>
  <rect x="70" y="40" width="5" height="3" rx="1.5" fill="rgba(255,255,255,0.55)"/>

  <!-- Blue block (left) -->
  <rect x="6" y="55" width="26" height="26" rx="5" fill="url(#gb)" stroke="#0a2c6e" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="9" y="58" width="11" height="7" rx="3.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Cyan block (center) -->
  <rect x="37" y="55" width="26" height="26" rx="5" fill="url(#gc)" stroke="#0660a0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="58" width="11" height="7" rx="3.5" fill="rgba(255,255,255,0.45)"/>

  <!-- Orange block (right) -->
  <rect x="68" y="55" width="26" height="26" rx="5" fill="url(#go)" stroke="#a85000" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="71" y="58" width="11" height="7" rx="3.5" fill="rgba(255,255,255,0.5)"/>
</svg>
